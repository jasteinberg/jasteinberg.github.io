<section class="hero" aria-label="Julia Steinberg">
  <canvas class="hero-canvas" aria-hidden="true"></canvas>
  <div class="hero-text">
    <h1 class="hero-name">Julia Steinberg</h1>
    <p class="hero-tagline">{{ site.description }}</p>
  </div>
</section>

<script>
(function () {
  var canvas = document.querySelector('.hero-canvas');
  if (!canvas || !canvas.getContext) return;
  var ctx = canvas.getContext('2d');
  var reduce = window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W = 0, H = 0, dpr = 1, dots = [], t0 = performance.now();

  // Two gradient stops drift slowly through a narrow cool range of hue.
  var hueA = 222, hueB = 262, hueSwing = 22, period = 24000;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var n = Math.round(W * H / 9000);
    dots = [];
    for (var i = 0; i < n; i++) dots.push(newDot());
  }

  function newDot() {
    return {
      x: Math.random() * W, y: Math.random() * H,
      r: 0.8 + Math.random() * 1.8,
      vx: (Math.random() - 0.5) * 0.18, vy: (Math.random() - 0.5) * 0.18,
      a: 0.25 + Math.random() * 0.45
    };
  }

  function frame(now) {
    var ph = 2 * Math.PI * ((now - t0) % period) / period;
    var h1 = hueA + hueSwing * Math.sin(ph);
    var h2 = hueB + hueSwing * Math.sin(ph + 2.1);
    var g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, 'hsl(' + h1 + ', 62%, 52%)');
    g.addColorStop(1, 'hsl(' + h2 + ', 55%, 58%)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    for (var i = 0; i < dots.length; i++) {
      var d = dots[i];
      if (!reduce) {
        d.x += d.vx; d.y += d.vy;
        if (d.x < -5) d.x = W + 5; else if (d.x > W + 5) d.x = -5;
        if (d.y < -5) d.y = H + 5; else if (d.y > H + 5) d.y = -5;
      }
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, 2 * Math.PI);
      ctx.fillStyle = 'rgba(255,255,255,' + d.a + ')';
      ctx.fill();
    }
    if (!reduce) requestAnimationFrame(frame);
  }

  resize();
  window.addEventListener('resize', function () {
    resize();
    if (reduce) frame(t0);
  });
  if (reduce) frame(t0); else requestAnimationFrame(frame);
})();
</script>
